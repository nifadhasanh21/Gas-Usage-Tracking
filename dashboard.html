<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GasTracker - Pro Console</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase, Chart.js, HTML5-QRCode, jsPDF & AutoTable -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="brand">
                <i class="fa-solid fa-fire"></i> GASTRACKER
            </a>
            <ul class="nav-menu">
                <li><a href="dashboard.html" class="active">Dashboard</a></li>
                <li><a href="#allUsageSection">All Usage Logs</a></li>
                <li id="adminNavSlot"></li>
                <li><button id="logoutBtn" class="btn-ice btn-danger-ice"><i class="fa-solid fa-power-off"></i></button></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        
        <!-- Live Status & Cylinder Meter -->
        <div class="card mb-4">
            <div class="card-header">
                <h3>Stove Status & Cylinder Health</h3>
            </div>
            
            <div class="cylinder-box mt-3 mb-4">
                <div class="cylinder-header">
                    <span><i class="fa-solid fa-gas-pump"></i> Cylinder Fuel Remaining</span>
                    <strong id="cylinderPctText">100%</strong>
                </div>
                <div class="progress-bar-bg">
                    <div id="cylinderProgressBar" class="progress-bar-fill" style="width: 100%;"></div>
                </div>
            </div>

            <div class="burner-status-grid" id="burnerStatusGrid"></div>
            <div id="liveCookingFeed" class="mt-3"></div>
            <div id="queueControls" class="mt-3 text-center"></div>
        </div>

        <!-- Timer Console -->
        <div class="card text-center mb-4">
            <div class="card-header">
                <h2>Stove Console</h2>
            </div>

            <div class="timer-display" id="timerDisplay">00:00:00</div>

            <div class="burner-selector" id="burnerSelector">
                <label class="radio-card">
                    <input type="radio" name="burnerOption" value="1" checked>
                    <div class="radio-content"><i class="fa-solid fa-fire"></i> 1 Burner</div>
                </label>
                <label class="radio-card">
                    <input type="radio" name="burnerOption" value="2">
                    <div class="radio-content"><i class="fa-solid fa-fire-burner"></i> 2 Burners</div>
                </label>
            </div>

            <div id="mealNoteBox" class="meal-input-box">
                <input type="text" id="mealNoteInput" class="input-glass" placeholder="What are you cooking? (e.g. Rice & Meat)">
            </div>

            <div class="console-actions">
                <button id="startBtn" class="btn-ice"><i class="fa-solid fa-play"></i> Start Cooking</button>
                <button id="stopBtn" class="btn-ice btn-danger-ice hidden"><i class="fa-solid fa-square"></i> Stop & Save Session</button>
            </div>
        </div>

        <!-- Visual Analytics Chart -->
        <div class="card mb-4">
            <div class="card-header">
                <h3>Daily Usage Analytics (Minutes)</h3>
            </div>
            <div class="mt-3">
                <canvas id="usageChart" style="max-height: 280px;"></canvas>
            </div>
        </div>

        <!-- All Usage Activity Logs & Cost Splitter -->
        <div class="card mb-4" id="allUsageSection">
            <div class="card-header" style="display:flex; justify-content:space-between; align-items:center;">
                <h3><i class="fa-solid fa-users"></i> All Member Usage & Cost Splitter</h3>
                <button id="downloadPdfBtn" class="btn-ice" style="padding: 8px 16px; font-size: 0.85rem;"><i class="fa-solid fa-file-pdf"></i> Download PDF Report</button>
            </div>
            <div id="dateWiseTablesContainer" class="mt-3"></div>
        </div>

        <!-- QR Code Scanner -->
        <div class="card text-center">
            <h3>Quick Kitchen Access</h3>
            <p class="subtitle mb-4">Scan Kitchen QR Code to sync instantly</p>
            <button id="scanQrBtn" class="btn-ice"><i class="fa-solid fa-qrcode"></i> Open QR Scanner</button>
            <div id="qrReaderBox" class="mt-3 hidden" style="max-width: 350px; margin: 10px auto;">
                <div id="reader"></div>
            </div>
        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
